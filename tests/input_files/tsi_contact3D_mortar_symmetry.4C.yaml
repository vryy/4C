TITLE:
  - "TSI contact conduction with symmetry constraints."
  - "This test consists of two HEX8 elements coming into contact in z direction."
  - "Two adjacent faces of the elements perpendicular to the contact normal are constrained in x and y
    direction, respectively."
  - "This is modelled by one mortar symmetry line and two symmetry points at the slave side."

PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"

IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
THERMAL DYNAMIC/RUNTIME VTK OUTPUT:
  OUTPUT_THERMO: true
  TEMPERATURE: true

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1

THERMAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  LINEAR_SOLVER: 1

TSI DYNAMIC:
  NUMSTEP: 2
  MAXTIME: 1
  TIMESTEP: 0.5

TSI DYNAMIC/MONOLITHIC:
  CONVTOL: 1e-10
  TOLINC: 1e-10
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true

CONTACT DYNAMIC:
  STRATEGY: "Lagrange"
  SYSTEM: "Condensed"
  LINEAR_SOLVER: 1
  CONSTRAINT_DIRECTIONS: xyz

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 10

SOLVER 1:
  SOLVER: "UMFPACK"

MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [4000]
      NUE: 0.3
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 2
    MAT_Fourier:
      CAPA: 0
      CONDUCT:
        constant: [52]

CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2

FUNCT1:
  # linear ramp shared by all Dirichlet conditions.
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"

DESIGN SURF DIRICH CONDITIONS:
  - E: 1 # non-contact side of element 1
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2 # non-contact side of element 2
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, -0.02]
    FUNCT: [0, 0, 1]
  - E: 5 # yz plane at x=0 of both elements, constrained in x direction
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 6 # xz plane at y=0 of both elements, constrained in y direction
    NUMDOF: 3
    ONOFF: [0, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]

DESIGN SURF THERMO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
  - E: 2
    NUMDOF: 1
    ONOFF: [1]
    VAL: [20]
    FUNCT: [1]

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 3 # contact side of element 1
    InterfaceID: 1
    Side: "Master"
  - E: 4 # contact side of element 2
    InterfaceID: 1
    Side: "Slave"

DESIGN LINE MORTAR SYMMETRY CONDITIONS 3D:
  - E: 1 # line on the slave side that is constrained in x direction (part of surface 5)
    ONOFF: [1, 0, 0]

DESIGN POINT MORTAR SYMMETRY CONDITIONS 2D/3D:
  - E: 1 # point on the slave side that is constrained in x and y direction (part of surface 5 and 6)
    ONOFF: [1, 1, 0]
  - E: 2 # point on the slave side that is constrained in y direction (part of surface 6)
    ONOFF: [0, 1, 0]

