TITLE:
  - "TSI contact conduction over two independent interfaces."
  - "This test consists of 4 HEX8 elements, organized in two pairs of unit cubes."
  - "Element 1 and 2 come into contact at interface 1."
  - "Element 3 and 4 come into contact at interface 2."
  - "The outer surfaces of the cubes carry Dirichlet conditions for both displacement and temperature."
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1

THERMAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  LINEAR_SOLVER: 1

TSI DYNAMIC:
  NUMSTEP: 2
  MAXTIME: 1
  TIMESTEP: 0.5

TSI DYNAMIC/MONOLITHIC:
  CONVTOL: 1e-10
  TOLINC: 1e-10
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true

CONTACT DYNAMIC:
  STRATEGY: "Lagrange"
  SYSTEM: "Condensed"
  LINEAR_SOLVER: 1

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 10

SOLVER 1:
  SOLVER: "UMFPACK"

MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [4000]
      NUE: 0
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 2
    MAT_Fourier:
      CAPA: 0
      CONDUCT:
        constant: [52]

CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2

FUNCT1:
  # linear ramp shared by all Dirichlet conditions.
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"

DESIGN SURF DIRICH CONDITIONS:
  - E: 1 # non-contact side of element 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2 # non-contact side of element 2
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, -0.02]
    FUNCT: [0, 0, 1]
  - E: 5 # non-contact side of element 3
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 6 # non-contact side of element 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, -0.04]
    FUNCT: [0, 0, 1]

DESIGN SURF THERMO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
  - E: 2
    NUMDOF: 1
    ONOFF: [1]
    VAL: [20]
    FUNCT: [1]
  - E: 5
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
  - E: 6
    NUMDOF: 1
    ONOFF: [1]
    VAL: [40]
    FUNCT: [1]
DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 3 # contact side of element 1
    InterfaceID: 1
    Side: "Master"
  - E: 4 # contact side of element 2
    InterfaceID: 1
    Side: "Slave"
  - E: 7 # contact side of element 3
    InterfaceID: 2
    Side: "Master"
  - E: 8 # contact side of element 4
    InterfaceID: 2
    Side: "Slave"

