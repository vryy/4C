  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [10, 10, 10]
    FUNCT: [1, 2, 3]
MATERIALS:
  - MAT: 1
    MAT_Ogden_TCA:
      C: 100
      M: 2
      Q: 0.1
      KAPPA: 1000
      DENS: 1.0
  - MAT: 2
    MAT_Ogden_TCA:
      C: 100
      M: 2
      Q: 0.9
      KAPPA: 1000
      DENS: 1.0
