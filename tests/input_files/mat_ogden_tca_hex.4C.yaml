TITLE:
  - Testcase for MAT_Ogden_TCA (Ogden hyperelasticity with tension-compression asymmetry control).
  - The setup contains two cubes discretized with HEX8 elements.
  - Both cubes are fixed on the bottom surface (z=0). On the top surface (z=1), a surface force is applied
    in x-, y- and z-direction subsequently.
  - Cube 1 uses the tension-compression asymmetry control parameter q=0.1, cube 2 uses q=0.9
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  STRUCT_STRESS: "2PK"
  STRUCT_STRAIN: "GL"
  VERBOSITY: Standard
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
STRUCT NOX/Printing:
  Outer Iteration: false
  Inner Iteration: false
  Outer Iteration StatusTest: false
STRUCTURAL DYNAMIC:
  INT_STRATEGY: Standard
  RESTARTEVERY: 25
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 30
  MAXTIME: 3
  TOLDISP: 1e-09
  TOLRES: 1e-09
  LINEAR_SOLVER: 1
  PREDICT: "ConstDisVelAcc"
SOLVER 1:
  SOLVER: "MUMPS"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 3
