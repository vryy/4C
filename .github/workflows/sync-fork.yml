name: Sync fork with upstream

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.REBASE_TOKEN }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/merge-upstream" \
            -f branch="main"
